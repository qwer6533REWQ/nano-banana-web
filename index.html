<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nano Banana · AI 图片生成</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --border: #e8eaed; --text: #1a1d21;
      --sub: #6b7280; --accent: #4f46e5; --accent2: #7c3aed; --accent-h: #4338ca;
      --danger: #ef4444; --ok: #16a34a; --warn: #d97706;
      --radius: 18px; --shadow: 0 4px 24px rgba(17,24,39,.06); --t: .18s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.55; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    .app { max-width: 980px; margin: 0 auto; padding: 28px 16px 70px; }
    .header { text-align: center; margin-bottom: 22px; }
    .logo { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
    .header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(120deg, #4f46e5, #7c3aed, #2563eb);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .ver-badge { display: inline-block; font-size: 10px; font-weight: 600; color: var(--accent); background: rgba(79,70,229,.1);
      padding: 2px 8px; border-radius: 20px; vertical-align: middle; margin-left: 6px; }
    .header p { color: var(--sub); font-size: 13px; margin-top: 6px; }

    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px; border: 1px solid var(--border); }
    .card-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

    .group { margin-bottom: 14px; }
    .group > label { display: block; font-size: 11px; font-weight: 700; color: var(--sub);
      text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
    input[type=text], input[type=password], input[type=number], textarea, select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px;
      font-size: 13px; font-family: inherit; color: var(--text); background: #fbfbfc; transition: var(--t); outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .key-row { display: flex; gap: 8px; }
    .key-row input { flex: 1; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px;
      font-size: 13px; font-weight: 600; font-family: inherit; border: none; border-radius: 10px; cursor: pointer; transition: var(--t); white-space: nowrap; }
    .btn-primary { background: linear-gradient(120deg, #4f46e5, #7c3aed); color: #fff; width: 100%; padding: 12px; font-size: 15px; box-shadow: 0 4px 14px rgba(79,70,229,.25); }
    .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-soft { background: #eef2ff; color: var(--accent); }
    .btn-soft:hover { background: #e0e7ff; }
    .btn-ghost { background: #f3f4f6; color: var(--text); flex: 1; }
    .btn-ghost:hover { background: #e5e7eb; }
    .icon-btn { padding: 12px 14px; background: #eef2ff; color: var(--accent); border-radius: 12px; cursor: pointer; border: none; font-size: 15px; }
    .icon-btn:hover { background: #e0e7ff; }

    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    .tabs { display: flex; gap: 6px; background: #f1f2f4; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 9px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 600;
      color: var(--sub); cursor: pointer; transition: var(--t); font-family: inherit; }
    .tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

    .dropzone { border: 2px dashed var(--border); border-radius: 12px; padding: 22px 14px; text-align: center;
      cursor: pointer; transition: var(--t); background: #fbfbfc; }
    .dropzone:hover, .dropzone.dragover { border-color: var(--accent); background: rgba(79,70,229,.04); }
    .dropzone .ic { font-size: 28px; opacity: .45; display: block; margin-bottom: 6px; }
    .dropzone .tx { color: var(--sub); font-size: 12px; }

    .previews { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .img-card { position: relative; display: flex; gap: 12px; align-items: center; padding: 10px;
      border: 1px solid var(--border); border-radius: 12px; background: #fbfbfc; }
    .img-card .tw { position: relative; width: 62px; height: 62px; border-radius: 9px; overflow: hidden; flex-shrink: 0; background: #eef0f3; }
    .img-card .tw img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-card .badge { position: absolute; top: 3px; left: 3px; padding: 2px 6px; border-radius: 5px; font-size: 10px;
      font-weight: 800; color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed); line-height: 1.2;
      letter-spacing: .3px; box-shadow: 0 1px 4px rgba(0,0,0,.3); z-index: 2; }
    .img-card .meta { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .img-card .name { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .img-card .idx { font-size: 11px; color: var(--accent); font-weight: 700; margin-right: auto; padding-left: 2px; }
    .img-card .rm { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: rgba(239,68,68,.9); color: #fff; border: none; font-size: 15px; cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center; transition: transform .15s; }
    .img-card .rm:hover { transform: scale(1.12); background: #dc2626; }

    .balance { margin-top: 10px; font-size: 12px; font-weight: 600; padding: 9px 12px; border-radius: 8px; word-break: break-all; display: none; }
    .hint { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.4; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }

    .err { display: none; padding: 13px 16px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 11px;
      color: var(--danger); font-size: 13px; margin-bottom: 18px; }
    .err.show { display: block; }
    .toast { position: fixed; top: 22px; left: 50%; transform: translateX(-50%) translateY(-20px); padding: 12px 28px;
      background: #1a1d21; color: #fff; border-radius: 12px; font-size: 14px; z-index: 9999; opacity: 0; pointer-events: none; transition: all .3s; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .result-panel { position: sticky; top: 12px; }
    .result-card { min-height: 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .place { text-align: center; color: var(--sub); }
    .place .ic { font-size: 44px; opacity: .3; margin-bottom: 12px; }
    .place p { font-size: 13px; line-height: 1.8; }
    .grid { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .item { position: relative; border-radius: 14px; overflow: hidden; background: #f3f4f6; }
    .item img { width: 100%; height: auto; display: block; }
    .item .ov { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: var(--t);
      display: flex; align-items: center; justify-content: center; gap: 10px; }
    .item:hover .ov { opacity: 1; }
    .item .ov .btn { padding: 8px 14px; font-size: 12px; }
    .loading { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 56px; }
    .loading.on { display: flex; }
    .spin { width: 46px; height: 46px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .loading .tx { color: var(--sub); font-size: 14px; }
    .resp { margin-top: 16px; font-size: 12px; color: var(--sub); word-break: break-all; text-align: center; display: none; }

    .history { margin-top: 24px; }
    .hist-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .hist { aspect-ratio: 1; border-radius: 12px; overflow: hidden; cursor: pointer; border: 2px solid transparent; position: relative; background: #f3f4f6; transition: var(--t); }
    .hist:hover { border-color: var(--accent); }
    .hist img { width: 100%; height: 100%; object-fit: cover; }
    .hist .tip { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.62); color: #fff; font-size: 10px; padding: 4px 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="app">
    <div class="toast" id="toast"></div>
    <div class="header">
      <div class="logo">AI Image Studio</div>
      <h1>Nano Banana <span class="ver-badge" id="verBadge">v…</span></h1>
      <p>填入你自己的 API Key，一句话即可生成图片 · 数据仅存本地</p>
    </div>

    <div class="err" id="errorMsg"></div>

    <div class="layout">
      <div>
        <div class="card">
          <div class="card-title">🎛 创作参数</div>

          <div class="tabs">
            <button class="tab active" id="tabText" onclick="setMode('text')">📝 文生图</button>
            <button class="tab" id="tabImage" onclick="setMode('image')">🖼 图生图</button>
          </div>

          <div class="group">
            <label>你的 API Key</label>
            <div class="key-row">
              <input type="password" id="apiKey" placeholder="sk-xxxxxxxxxxx" autocomplete="off">
              <button class="icon-btn" id="toggleKeyBtn" type="button" title="显示/隐藏">👁</button>
            </div>
            <button class="btn btn-soft" style="margin-top:10px; width:100%; font-size:13px;" onclick="checkBalance()">💰 查询余额</button>
            <div class="balance" id="balanceInfo"></div>
          </div>

          <div class="divider"></div>

          <div class="group">
            <label>描述词 (Prompt)</label>
            <textarea id="prompt" placeholder="例如：生成一张边牧与古牧正在抖音直播间直播带货截图"></textarea>
          </div>

          <div class="group" id="imageUploadGroup" style="display:none;">
            <label>参考图（图生图模式，可多张）</label>
            <div class="dropzone" id="dropzone" onclick="document.getElementById('imageInput').click()">
              <span class="ic">📤</span>
              <span class="tx">点击或拖拽图片到此处上传</span>
            </div>
            <input type="file" id="imageInput" accept="image/*" multiple hidden>
            <div class="previews" id="imagePreview"></div>
            <div style="margin-top:14px;">
              <label style="display:block; font-size:12px; font-weight:700; color:var(--sub); margin-bottom:8px;">或粘贴图片 URL（大图推荐，自动并入参考图）</label>
              <div class="key-row">
                <input type="text" id="imageUrl" placeholder="https://example.com/ref.png">
                <button class="icon-btn" type="button" onclick="addImageUrl()" title="添加">＋</button>
              </div>
              <div class="hint">支持本地图（转 base64）与图片 URL 混用，按上传顺序排列。</div>
            </div>
          </div>

          <div class="row">
            <div class="group">
              <label>模型</label>
              <select id="model">
                <option value="nano-banana-pro" selected>nano-banana-pro</option>
                <option value="nano-banana-2">nano-banana-2</option>
                <option value="nano-banana">nano-banana</option>
              </select>
            </div>
            <div class="group">
              <label>画幅</label>
              <select id="aspectRatio">
                <option value="1:1">1:1 方形</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="16:9">16:9 宽屏</option>
                <option value="9:16">9:16 竖屏</option>
                <option value="3:2">3:2</option>
                <option value="2:3">2:3</option>
              </select>
            </div>
          </div>

          <div class="group">
            <label>质量</label>
            <select id="imageSize">
              <option value="1K" selected>1K</option>
              <option value="2K">2K</option>
              <option value="4K">4K</option>
            </select>
          </div>

          <div class="group">
            <label>时长（秒，可选）</label>
            <input type="number" id="duration" min="1" max="60" placeholder="留空=图片；填值可生成视频">
            <div class="hint">仅视频模型 / 视频生成时生效，单位秒（1–60）。</div>
          </div>

          <button class="btn btn-primary" id="generateBtn" onclick="generate()">✨ 生成图片</button>

          <div class="actions">
            <button class="btn btn-ghost" onclick="shareLink()">🔗 复制分享链接</button>
            <button class="btn btn-ghost" onclick="showQR()">📱 二维码</button>
            <button class="btn btn-ghost" onclick="randomPrompt()">🎲 灵感</button>
          </div>
        </div>

        <div class="history card" id="historyCard" style="display:none; margin-top:24px;">
          <div class="card-title">📚 我的历史</div>
          <div class="hist-list" id="historyList"></div>
          <button class="btn btn-soft" style="width:100%; margin-top:14px; font-size:13px;" onclick="clearHistory()">🗑 清空历史</button>
        </div>
      </div>

      <div class="result-panel">
        <div class="card result-card" id="resultCard">
          <div class="place" id="placeholder">
            <div class="ic">🎨</div>
            <p>填入 Key 与描述，点击生成<br>图片将显示在这里</p>
          </div>
          <div class="loading" id="loading">
            <div class="spin"></div>
            <div class="tx" id="loadingText">AI 正在生成图片…</div>
          </div>
          <div class="grid" id="resultGrid" style="display:none;"></div>
          <div class="resp" id="responseInfo"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9999; align-items:center; justify-content:center;" onclick="if(event.target===this)closeQR()">
    <div style="background:#fff; padding:26px 24px; border-radius:18px; text-align:center; max-width:330px; width:86%; box-shadow:0 14px 44px rgba(0,0,0,.28);">
      <div style="font-weight:700; font-size:16px; margin-bottom:6px;">📱 扫码打开此页面</div>
      <div style="font-size:12px; color:#888; margin-bottom:16px;">用手机扫描下方二维码即可访问</div>
      <div id="qrCode" style="display:flex; justify-content:center; margin-bottom:14px;"></div>
      <div id="qrUrl" style="font-size:11px; color:#666; word-break:break-all; line-height:1.5; margin-bottom:16px;"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="closeQR()">关闭</button>
    </div>
  </div>

  <script>
    const APP_VERSION = '20260730-0944';
    // 版本机制：用「带版本号的 URL」作为缓存键。用户打开我给的新版链接时，
    // CDN 必然回源拿最新页；若用旧链接打开则自动纠正到最新版 URL。
    (function () {
      try {
        const v = new URLSearchParams(location.search).get('v');
        if (v !== APP_VERSION && !sessionStorage.getItem('nb_vredir')) {
          sessionStorage.setItem('nb_vredir', '1');
          location.replace(location.origin + location.pathname + '?v=' + APP_VERSION);
        }
        const _vb = document.getElementById('verBadge');
        if (_vb) _vb.textContent = 'v' + APP_VERSION;
      } catch (e) {}
    })();

    let history = JSON.parse(localStorage.getItem('nb_history') || '[]');
    let mode = 'text';
    let uploadedImages = [];
    let genStart = 0;
    const RANDOM_PROMPTS = [
      '赛博朋克风格的未来城市夜景，霓虹灯反射在湿漉漉的街道上',
      '一只戴草帽的橘猫在向日葵花田里写生，水彩插画风',
      '极简主义北欧风客厅，阳光透过百叶窗，柔和暖色调',
      '中国风仙鹤与梅花，工笔水墨画质感',
      '宇航员在太空中冲泡咖啡，星轨环绕，超写实 8K',
      '复古胶片质感的海边小镇黄昏，橘色天空与白色房屋',
      '美食摄影：一碗热气腾腾的拉面，俯拍，暖光',
      '机甲少女站在樱花飘落的校园天台，动漫风格'
    ];

    document.addEventListener('DOMContentLoaded', () => {
      restoreSettings();
      restoreFromHash();
      renderHistory();
      document.getElementById('toggleKeyBtn').addEventListener('click', () => {
        const i = document.getElementById('apiKey');
        i.type = i.type === 'password' ? 'text' : 'password';
      });
      document.getElementById('prompt').addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') generate();
      });
      ['apiKey', 'model', 'aspectRatio', 'imageSize'].forEach(id => {
        document.getElementById(id).addEventListener('change', saveSettings);
      });
      const dz = document.getElementById('dropzone');
      const imgInput = document.getElementById('imageInput');
      dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
      dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
      dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
      imgInput.addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
    });

    function setMode(m) {
      mode = m;
      document.getElementById('tabText').classList.toggle('active', m === 'text');
      document.getElementById('tabImage').classList.toggle('active', m === 'image');
      document.getElementById('imageUploadGroup').style.display = m === 'image' ? 'block' : 'none';
      document.getElementById('prompt').placeholder = m === 'image'
        ? '描述你想对参考图做的修改，例如：把背景换成星空、转成水彩风格'
        : '例如：生成一张边牧与古牧正在抖音直播间直播带货截图';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function handleFiles(files) {
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = () => { uploadedImages.push({ src: reader.result, name: file.name }); renderPreview(); };
        reader.readAsDataURL(file);
      });
    }

    function renderPreview() {
      const labels = ['图一', '图二', '图三', '图四', '图五', '图六', '图七', '图八', '图九', '图十'];
      const cards = uploadedImages.map((img, i) => {
        const label = labels[i] || ('图' + (i + 1));
        return `<div class="img-card">
          <div class="tw"><span class="badge">${label}</span><img src="${img.src}" alt=""></div>
          <div class="meta">
            <span class="name">${esc(img.name || label)}</span>
            <button class="rm" onclick="removeImage(${i})" title="移除">×</button>
          </div>
        </div>`;
      });
      document.getElementById('imagePreview').innerHTML = cards.join('');
    }

    function removeImage(i) {
      uploadedImages.splice(i, 1);
      renderPreview();
    }

    function addImageUrl() {
      const input = document.getElementById('imageUrl');
      const v = input.value.trim();
      if (!v) { showError('请先粘贴图片 URL'); input.focus(); return; }
      uploadedImages.push({ src: v, name: v });
      input.value = '';
      renderPreview();
      showToast('已添加图片 URL 作为参考图');
    }

    function formatBalance(data) {
      if (typeof data === 'number') return data + ' 积分';
      const keys = ['credits', 'balance', 'remaining', 'quota', 'amount', 'credit'];
      const dig = (o) => {
        if (!o || typeof o !== 'object') return null;
        for (const k of keys) if (typeof o[k] === 'number') return o[k];
        for (const k in o) { if (typeof o[k] === 'object') { const r = dig(o[k]); if (r !== null) return r; } }
        return null;
      };
      const v = dig(data);
      return v !== null ? v + ' 积分' : (typeof data === 'string' ? data : JSON.stringify(data).slice(0, 200));
    }

    async function checkBalance() {
      const apiKey = document.getElementById('apiKey').value.trim();
      if (!apiKey) { showError('请先填写 API Key'); document.getElementById('apiKey').focus(); return; }
      const baseUrl = getBaseUrl();
      const info = document.getElementById('balanceInfo');
      info.style.display = 'block';
      info.style.color = 'var(--sub)'; info.style.background = '#f3f4f6'; info.textContent = '查询中…';
      const headers = { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' };
      const ok = (d) => {
        if (!d || typeof d !== 'object') return false;
        if (typeof d.code === 'number' && d.code !== 0) return false;
        const txt = formatBalance(d);
        return /[0-9]/.test(txt);
      };
      try {
        const res1 = await fetch(`${baseUrl}/client/common/getCredits?apikey=${encodeURIComponent(apiKey)}`, { method: 'GET', headers });
        const d1 = await res1.json().catch(() => ({}));
        if (ok(d1)) {
          info.style.color = 'var(--ok)'; info.style.background = '#ecfdf5';
          info.textContent = '💰 该 API Key 余额：' + formatBalance(d1); return;
        }
        const res2 = await fetch(`${baseUrl}/client/openapi/getAPIKeyCredits`, { method: 'POST', headers, body: JSON.stringify({ apikey: apiKey }) });
        const d2 = await res2.json().catch(() => ({}));
        if (ok(d2)) {
          info.style.color = 'var(--ok)'; info.style.background = '#ecfdf5';
          info.textContent = '💰 该 API Key 余额：' + formatBalance(d2); return;
        }
        const res3 = await fetch(`${baseUrl}/client/openapi/getCredits`, { method: 'POST', headers, body: JSON.stringify({}) });
        const d3 = await res3.json().catch(() => ({}));
        if (ok(d3)) {
          info.style.color = 'var(--warn)'; info.style.background = '#fffbeb';
          info.textContent = '⚠️ 仅查到账户余额（非单 Key）：' + formatBalance(d3); return;

    }

    function restoreSettings() {
      const k = localStorage.getItem('nb_apikey'); if (k) document.getElementById('apiKey').value = k;
      const m = localStorage.getItem('nb_model'); if (m) document.getElementById('model').value = m;
      const ar = localStorage.getItem('nb_ar'); if (ar) document.getElementById('aspectRatio').value = ar;
      const sz = localStorage.getItem('nb_size'); if (sz) document.getElementById('imageSize').value = sz;
    }
    function saveSettings() {
      localStorage.setItem('nb_apikey', document.getElementById('apiKey').value);
      localStorage.setItem('nb_model', document.getElementById('model').value);
      localStorage.setItem('nb_ar', document.getElementById('aspectRatio').value);
      localStorage.setItem('nb_size', document.getElementById('imageSize').value);
    }
    function restoreFromHash() {
      const h = location.hash.replace(/^#/, '');
      if (!h) return;
      try {
        const p = JSON.parse(decodeURIComponent(h));
        if (p.prompt) document.getElementById('prompt').value = p.prompt;
        if (p.model) document.getElementById('model').value = p.model;
        if (p.ar) document.getElementById('aspectRatio').value = p.ar;
        if (p.size) document.getElementById('imageSize').value = p.size;
        if (p.duration) document.getElementById('duration').value = p.duration;
        if (p.imageUrl) { uploadedImages.push({ src: p.imageUrl, name: p.imageUrl }); document.getElementById('imageUrl').value = ''; }
        if (Array.isArray(p.images)) p.images.forEach(src => uploadedImages.push({ src, name: src }));
        if (uploadedImages.length) { renderPreview(); setMode('image'); }
      } catch (e) {}
    }
    function getBaseUrl() { return 'https://grsaiapi.com'; }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 6000);
    }
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }
    function setLoading(on, text) {
      document.getElementById('placeholder').style.display = on ? 'none' : 'flex';
      document.getElementById('loading').classList.toggle('on', on);
      if (text) document.getElementById('loadingText').textContent = text;
      document.getElementById('resultGrid').style.display = on ? 'none' : 'grid';
      document.getElementById('responseInfo').style.display = 'none';
    }

    async function generate() {
      hideError();
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const model = document.getElementById('model').value;
      const aspectRatio = document.getElementById('aspectRatio').value;
      const imageSize = document.getElementById('imageSize').value;
      const duration = document.getElementById('duration').value.trim();
      const baseUrl = getBaseUrl();
      const images = mode === 'image' ? uploadedImages.map(x => x.src) : [];

      if (!apiKey) { showError('请先填写你的 API Key'); document.getElementById('apiKey').focus(); return; }
      if (mode === 'text' && !prompt) { showError('请输入图片描述'); document.getElementById('prompt').focus(); return; }
      if (mode === 'image' && images.length === 0) { showError('请先上传或粘贴参考图'); document.getElementById('dropzone').scrollIntoView({ behavior: 'smooth' }); return; }

      localStorage.setItem('nb_apikey', apiKey);
      saveSettings();

      const url = `${baseUrl}/v1/api/generate`;
      const headers = { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' };
      const body = { model, prompt, images, aspectRatio, imageSize, replyType: 'json' };
      if (duration) body.duration = Number(duration);

      setLoading(true);
      genStart = Date.now();
      try {
        const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
        let data; try { data = await res.json(); } catch (e) { data = {}; }
        if (!res.ok) { setLoading(false); showError(`请求失败 (${res.status}): ${JSON.stringify(data).slice(0, 300)}`); return; }
        if (data.status === 'succeeded') {
          showResults(data); addHistory(prompt, data.results); showToast('生成成功！');
        } else if (data.status === 'processing') {
          await pollStatus(data.id, prompt, apiKey, baseUrl);
        } else {
          setLoading(false); showError('生成失败: ' + JSON.stringify(data).slice(0, 300));
        }
      } catch (err) {
        setLoading(false); showError('网络错误: ' + err.message);
      }
    }
    function hideError() { document.getElementById('errorMsg').classList.remove('show'); }

    async function pollStatus(id, prompt, apiKey, baseUrl) {
      setLoading(true, '图片处理中，请稍候…');
      const maxAttempts = 60, interval = 3000;
      for (let i = 0; i < maxAttempts; i++) {
        await sleep(interval);
        try {
          const res = await fetch(`${baseUrl}/v1/api/generate/status/${id}`, { headers: { 'Authorization': `Bearer ${apiKey}` } });
          if (res.status === 404) { setLoading(false); showError('异步状态接口不可用，任务 ID: ' + id); return; }
          const d = await res.json();
          if (d.status === 'succeeded') { showResults(d); addHistory(prompt, d.results); showToast('生成成功！'); return; }
          if (d.status === 'failed') { setLoading(false); showError('生成失败: ' + (d.error || '未知')); return; }
        } catch (e) {}
      }
      setLoading(false); showError('轮询超时（约3分钟），任务 ID: ' + id);
    }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function showResults(data) {
      setLoading(false);
      const grid = document.getElementById('resultGrid');
      const urls = (data.results || []).map(r => r.url).filter(Boolean);
      grid.innerHTML = urls.map(u => `
        <div class="item">
          <img src="${u}" alt="结果" loading="lazy" onerror="this.parentElement.innerHTML='<p style=color:#ef4444;padding:30px;text-align:center>图片加载失败</p>'">
          <div class="ov">
            <button class="btn btn-soft" onclick="downloadImg('${u}')">💾 下载</button>
            <button class="btn btn-soft" onclick="copyUrl('${u}')">📋 链接</button>
          </div>
        </div>`).join('');
      grid.style.display = 'grid';
      const info = document.getElementById('responseInfo');
      const sec = genStart ? ((Date.now() - genStart) / 1000).toFixed(1) : null;
      info.innerHTML = `任务 ID: ${data.id || 'N/A'} · <span style="color:var(--ok);font-weight:600;">✓ 成功</span> · ${urls.length} 张` +
        (sec ? ` · ⏱ 耗时 ${sec}s` : '');
      info.style.display = 'block';
    }
    function downloadImg(u) {
      const a = document.createElement('a');
      a.href = u; a.download = `nano-banana-${Date.now()}.png`;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
    function copyUrl(u) {
      navigator.clipboard.writeText(u).then(() => showToast('链接已复制')).catch(() => showToast('复制失败'));
    }

    function shareLink() {
      const params = {
        prompt: document.getElementById('prompt').value.trim(),
        model: document.getElementById('model').value,
        ar: document.getElementById('aspectRatio').value,
        size: document.getElementById('imageSize').value,
        duration: document.getElementById('duration').value.trim(),
        images: uploadedImages.map(x => x.src)
      };
      if (!params.prompt) { showError('先输入描述词再分享'); document.getElementById('prompt').focus(); return; }
      const link = `${location.origin}${location.pathname}?v=${APP_VERSION}#${encodeURIComponent(JSON.stringify(params))}`;
      navigator.clipboard.writeText(link).then(() => showToast('分享链接已复制！')).catch(() => {
        const ta = document.createElement('textarea'); ta.value = link; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); showToast('分享链接已复制！');
      });
    }
    function randomPrompt() {
      const p = RANDOM_PROMPTS[Math.floor(Math.random() * RANDOM_PROMPTS.length)];
      document.getElementById('prompt').value = p;
      showToast('已填入随机灵感 ✨');
    }

    function addHistory(prompt, results) {
      const urls = (results || []).map(r => r.url).filter(Boolean);
      if (urls.length === 0) return;
      urls.forEach(u => history.unshift({ prompt, url: u, time: Date.now() }));
      if (history.length > 40) history = history.slice(0, 40);
      localStorage.setItem('nb_history', JSON.stringify(history));
      renderHistory();
    }
    function renderHistory() {
      const card = document.getElementById('historyCard');
      if (history.length === 0) { card.style.display = 'none'; return; }
      card.style.display = 'block';
      document.getElementById('historyList').innerHTML = history.map((it, i) => `
        <div class="hist" onclick="loadHistory(${i})">
          <img src="${it.url}" alt="" loading="lazy" onerror="this.style.display='none'">
          <div class="tip">${it.prompt}</div>
        </div>`).join('');
    }
    function loadHistory(i) {
      const it = history[i]; if (!it) return;
      const grid = document.getElementById('resultGrid');
      grid.innerHTML = `<div class="item"><img src="${it.url}" alt=""><div class="ov"><button class="btn btn-soft" onclick="downloadImg('${it.url}')">💾 下载</button><button class="btn btn-soft" onclick="copyUrl('${it.url}')">📋 链接</button></div></div>`;
      grid.style.display = 'grid';
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('responseInfo').style.display = 'none';
      document.getElementById('prompt').value = it.prompt;
    }
    function clearHistory() {
      if (confirm('确认清空历史记录？')) {
        history = []; localStorage.setItem('nb_history', '[]'); renderHistory(); showToast('历史已清空');
      }
    }
    function showQR() {
      const url = location.origin + location.pathname + '?v=' + APP_VERSION;
      const modal = document.getElementById('qrModal');
      const box = document.getElementById('qrCode');
      box.innerHTML = '';
      try {
        new QRCode(box, { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
      } catch (e) {
        box.innerHTML = '<div style="color:#d33;font-size:12px;padding:20px 0;">生成失败：' + e.message + '</div>';
      }
      document.getElementById('qrUrl').textContent = url;
      modal.style.display = 'flex';
    }
    function closeQR() { document.getElementById('qrModal').style.display = 'none'; }
